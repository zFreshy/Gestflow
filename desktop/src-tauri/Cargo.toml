[package]
name = "mercadinho"
version = "0.1.0"
description = "Mercadinho - PDV e controle de estoque"
authors = ["zFreshy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mercadinho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Impressao direta na bobina passa pelo spooler do Windows (ver src/printer.rs).
# `windows-sys` e nao `windows`: sao ligacoes cruas, sem camada de tipos por
# cima, o que deixa a chamada igual a documentacao da Microsoft e evita
# surpresa de assinatura a cada versao.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
