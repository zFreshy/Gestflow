[package]
name = "mercadinho"
version = "0.1.0"
description = "Mercadinho - PDV e controle de estoque"
authors = ["zFreshy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mercadinho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
